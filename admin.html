<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Lao IT Learning</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="container">
    <h1>⭐ Admin Dashboard</h1>
    <p>ຈັດການຄຳຂໍສະໝັກ Premium</p>

    <button id="adminLoginBtn">Login Admin</button>
    <button id="adminLogoutBtn" hidden>Logout</button>

    <p id="adminMessage"></p>

    <section id="adminPanel" hidden>
      <h2>ລາຍການສະໝັກ Premium</h2>
      <button id="refreshRequests">🔄 ໂຫຼດລາຍການ</button>
      <div id="requestList"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./script.js"></script>
  <script src="./admin.js"></script>

</body>
</html>
