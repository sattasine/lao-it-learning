<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Lao IT Learning</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="admin-page">

  <main class="container">
    <h1>⭐ Admin Dashboard</h1>
    <p>ຈັດການຄຳຂໍສະໝັກ Premium</p>
<button id="adminLogoutBtn" hidden>Logout</button>

    <p id="adminMessage"></p>

    <section id="adminPanel" hidden>
      
<div class="admin-stats">

  <div class="admin-stat-card">
    <span>📋 ຄຳຂໍທັງໝົດ</span>
    <strong id="totalRequests">0</strong>
  </div>

  <div class="admin-stat-card">
    <span>⏳ ລໍຖ້າກວດ</span>
    <strong id="pendingRequests">0</strong>
  </div>

  <div class="admin-stat-card">
    <span>✅ ອະນຸມັດແລ້ວ</span>
    <strong id="approvedRequests">0</strong>
  </div>

  <div class="admin-stat-card">
    <span>❌ ປະຕິເສດ</span>
    <strong id="rejectedRequests">0</strong>
  </div>

</div>
      <div class="admin-filters">
  <button onclick="filterRequests('all')">ທັງໝົດ</button>
  <button onclick="filterRequests('pending')">ລໍຖ້າກວດ</button>
  <button onclick="filterRequests('approved')">ອະນຸມັດແລ້ວ</button>
  <button onclick="filterRequests('rejected')">ປະຕິເສດ</button>
</div>

      <h2>ລາຍການສະໝັກ Premium</h2>
      <button id="refreshRequests">🔄 ໂຫຼດລາຍການ</button>
      <div id="requestList"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./script.js"></script>
  <script src="./admin.js"></script>

</body>
</html>
